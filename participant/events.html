<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events - EventOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css?v=5" />
  <link rel="stylesheet" href="../css/dashboard.css?v=5" />
  <style>
    /* ── Modal badge styles ── */
    .modal-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .modal-badge-white {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }
    .modal-badge-green {
      background: rgba(34,197,94,0.25);
      color: #4ade80;
    }
    .modal-badge-amber {
      background: rgba(251,191,36,0.25);
      color: #fbbf24;
    }
    .modal-badge-purple {
      background: rgba(139,92,246,0.25);
      color: #c4b5fd;
    }

    /* ── Modal detail rows ── */
    .modal-detail-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .modal-detail-row:last-child {
      border-bottom: none;
    }
    .modal-detail-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .modal-detail-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.15rem;
    }
    .modal-detail-value {
      font-size: 0.875rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ── Description block ── */
    #modalDescription {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.65;
      padding: 1rem;
      background: var(--surface-2);
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }

    /* ── Reg closed msg ── */
    #modalRegClosedMsg {
      text-align: center;
      font-size: 0.82rem;
      color: var(--slate);
      padding: 0.75rem;
      background: var(--surface-2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="dashboard" class="nav-logo">Event<span>Ops</span></a>
      <ul class="nav-links">
        <li><a href="dashboard">Dashboard</a></li>
        <li><a href="events" class="active">Events</a></li>
        <li><a href="my-registrations">My Registrations</a></li>
        <li><a href="my-certificates">Certificates</a></li>
      </ul>
      <div class="nav-user">
        <span class="nav-user-name" id="navName">-</span>
        <span class="nav-role-badge role-participant">Participant</span>
        <button class="nav-logout" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="dash-main">

    <section class="dash-greeting">
      <div class="dash-greeting-inner">
        <p class="dash-greeting-sub">Discover</p>
        <h1 class="dash-greeting-name">All Events</h1>
      </div>
    </section>

    <!-- FILTERS -->
    <div class="filter-bar">
      <input class="form-input filter-search" id="searchInput" type="text" placeholder="Search events…" />
      <select class="form-select filter-select" id="statusFilter">
        <option value="all">All events</option>
        <option value="available">Available</option>
        <option value="registered">Registered</option>
        <option value="full">Full</option>
      </select>
    </div>

    <div id="eventGrid" class="event-grid">
      <div class="loading-state" style="grid-column:1/-1">
        <div class="spinner"></div><span>Loading events…</span>
      </div>
    </div>

  </main>

  <!-- EVENT DETAIL / REGISTER / QR MODAL -->
  <div class="modal-overlay hidden" id="eventModal">
    <div class="modal" style="max-width:540px;padding:0;overflow:hidden;border-radius:var(--radius-lg);">

      <!-- BANNER -->
      <div id="modalBanner" style="width:100%;height:160px;overflow:hidden;position:relative;flex-shrink:0;">
        <img id="modalBannerImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;" />
        <div id="modalBannerGradient" style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1.25rem 1.5rem;background:linear-gradient(135deg,#4F46E5,#6C63FF);">
          <div id="modalBannerTitle" style="font-family:var(--font-head);font-size:1.25rem;font-weight:800;color:#fff;line-height:1.25;margin-bottom:0.5rem;"></div>
          <div id="modalBannerBadges" style="display:flex;gap:0.4rem;flex-wrap:wrap;"></div>
        </div>
        <button id="eventModalClose" style="position:absolute;top:0.75rem;right:0.75rem;background:rgba(0,0,0,0.35);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;line-height:1;">✕</button>
      </div>

      <!-- BODY -->
      <div style="padding:1.25rem 1.5rem;max-height:70vh;overflow-y:auto;">

        <!-- STATE 1: EVENT DETAILS -->
        <div id="modalStateDetails">

          <!-- Detail rows -->
          <div id="modalMeta" style="margin-bottom:1rem;"></div>

          <!-- Description -->
          <div id="modalDescription" style="display:none;"></div>

          <!-- Tags -->
          <div id="modalExtraInfo" style="margin-bottom:1rem;display:none;"></div>

          <!-- Action -->
          <button class="btn btn-primary" id="modalRegisterBtn" style="width:100%;margin-top:0.5rem;">Register</button>
          <p id="modalRegClosedMsg" class="hidden" style="margin-top:0.75rem;"></p>
        </div>

        <!-- STATE 2: QR CODE -->
        <div id="modalStateQR" class="hidden" style="text-align:center;padding:1rem 0;">
          <p style="font-size:0.82rem;color:var(--slate);margin-bottom:1.25rem;">Show this QR at the gate for check-in</p>
          <div id="modalQRWrap" style="display:flex;align-items:center;justify-content:center;min-height:200px;"></div>
          <a class="btn btn-secondary" id="modalQRDownload" href="#" download style="margin-top:1.25rem;display:inline-flex;width:100%;">⬇ Download QR</a>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js?v=9"></script>
  <script src="../js/auth.js?v=6"></script>
  <script src="../js/ui.js?v=6"></script>
  <script src="../js/participant/participant-hamburger.js?v=6"></script>
  <script src="../js/participant/event-modal.js?v=2"></script>
  <script src="../js/participant/events.js?v=10"></script>
</body>
</html>
