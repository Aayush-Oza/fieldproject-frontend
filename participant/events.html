<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events - EventOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css?v=6" />
  <link rel="stylesheet" href="../css/dashboard.css?v=6" />
  <link rel="stylesheet" href="../css/event-modal.css?v=1" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="dashboard" class="nav-logo">Event<span>Ops</span></a>
    <ul class="nav-links">
      <li><a href="dashboard">Dashboard</a></li>
      <li><a href="events" class="active">Events</a></li>
      <li><a href="my-registrations">My Registrations</a></li>
      <li><a href="my-certificates">Certificates</a></li>
    </ul>
    <div class="nav-user">
      <span class="nav-user-name" id="navName">-</span>
      <span class="nav-role-badge role-participant">Participant</span>
      <button class="nav-logout" id="logoutBtn">Sign out</button>
    </div>
  </div>
</nav>

<main class="dash-main">

  <section class="dash-greeting">
    <div class="dash-greeting-inner">
      <p class="dash-greeting-sub">Discover</p>
      <h1 class="dash-greeting-name">All Events</h1>
    </div>
  </section>

  <div class="filter-bar">
    <input class="form-input filter-search" id="searchInput" type="text" placeholder="Search events…" />
    <select class="form-select filter-select" id="statusFilter">
      <option value="all">All events</option>
      <option value="available">Available</option>
      <option value="registered">Registered</option>
      <option value="full">Full</option>
    </select>
  </div>

  <div id="eventGrid" class="event-grid">
    <div class="loading-state" style="grid-column:1/-1">
      <div class="spinner"></div><span>Loading events…</span>
    </div>
  </div>

</main>

<!-- EVENT MODAL — body-level -->
<div class="em-overlay hidden" id="eventModal">
  <div class="em-box">

    <div class="em-banner" id="modalBannerWrap">
      <img class="em-banner-img" id="modalBannerImg" src="" alt="" />
      <button class="em-close" id="eventModalClose">✕</button>
      <div class="em-banner-content">
        <div class="em-badges" id="modalBannerBadges"></div>
        <h3 class="em-title" id="modalBannerTitle"></h3>
      </div>
    </div>

    <div class="em-body">

      <div id="modalStateDetails">
        <div id="modalMeta" class="em-meta"></div>
        <p id="modalDescription" class="em-desc"></p>
        <div id="modalExtraInfo" class="em-extra"></div>
        <p id="modalRegClosedMsg" class="em-closed-msg hidden"></p>
        <button id="modalRegisterBtn" class="btn btn-primary btn-full hidden">Register</button>
      </div>

      <div id="modalStateQR" class="hidden em-qr-state">
        <p class="em-qr-hint">Show this QR at the gate</p>
        <div id="modalQRWrap" class="em-qr-wrap"></div>
        <a id="modalQRDownload" class="btn btn-secondary btn-full" href="#" download>⬇ Download QR</a>
      </div>

    </div>
  </div>
</div>

<script src="../js/api.js?v=9"></script>
<script src="../js/auth.js?v=6"></script>
<script src="../js/ui.js?v=6"></script>
<script src="../js/participant/participant-hamburger.js?v=6"></script>
<script src="../js/participant/event-modal.js?v=3"></script>
<script src="../js/participant/events.js?v=10"></script>
</body>
</html>
