<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events - EventOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css?v=5" />
  <link rel="stylesheet" href="../css/dashboard.css?v=5" />
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="dashboard" class="nav-logo">Event<span>Ops</span></a>
      <ul class="nav-links">
        <li><a href="dashboard">Dashboard</a></li>
        <li><a href="events" class="active">Events</a></li>
        <li><a href="my-registrations">My Registrations</a></li>
        <li><a href="my-certificates">Certificates</a></li>
      </ul>
      <div class="nav-user">
        <span class="nav-user-name" id="navName">-</span>
        <span class="nav-role-badge role-participant">Participant</span>
        <button class="nav-logout" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="dash-main">

    <section class="dash-greeting">
      <div class="dash-greeting-inner">
        <p class="dash-greeting-sub">Discover</p>
        <h1 class="dash-greeting-name">All Events</h1>
      </div>
    </section>

    <!-- FILTERS -->
    <div class="filter-bar">
      <input class="form-input filter-search" id="searchInput" type="text" placeholder="Search events…" />
      <select class="form-select filter-select" id="statusFilter">
        <option value="all">All events</option>
        <option value="available">Available</option>
        <option value="registered">Registered</option>
        <option value="full">Full</option>
      </select>
    </div>

    <div id="eventGrid" class="event-grid">
      <div class="loading-state" style="grid-column:1/-1">
        <div class="spinner"></div><span>Loading events…</span>
      </div>
    </div>

  </main>

  <!-- EVENT DETAIL / REGISTER / QR MODAL -->
  <div class="modal-overlay hidden" id="eventModal">
    <div class="modal" style="max-width:560px;padding:0;overflow:hidden;">

      <!-- BANNER -->
      <div id="modalBanner" style="width:100%;height:180px;overflow:hidden;position:relative;flex-shrink:0;">
        <img id="modalBannerImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;" />
        <div id="modalBannerGradient" style="width:100%;height:100%;display:flex;align-items:flex-end;padding:1.25rem 1.5rem;background:linear-gradient(135deg,rgba(59,111,232,0.9),rgba(99,51,200,0.85));">
          <div>
            <div id="modalBannerTitle" style="font-family:var(--font-head);font-size:1.35rem;font-weight:800;color:#fff;line-height:1.2;"></div>
            <div id="modalBannerBadges" style="display:flex;gap:0.4rem;margin-top:0.4rem;flex-wrap:wrap;"></div>
          </div>
        </div>
        <button class="modal-close" id="eventModalClose" style="position:absolute;top:0.75rem;right:0.75rem;background:rgba(0,0,0,0.4);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;">✕</button>
      </div>

      <!-- BODY -->
      <div style="padding:1.25rem 1.5rem;max-height:65vh;overflow-y:auto;">

        <!-- STATE 1: EVENT DETAILS -->
        <div id="modalStateDetails">
          <div id="modalMeta" style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1rem;"></div>
          <div id="modalDescription" style="font-size:0.875rem;color:var(--slate);line-height:1.6;margin-bottom:1rem;"></div>
          <div id="modalExtraInfo" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.25rem;"></div>
          <button class="btn btn-primary btn-full" id="modalRegisterBtn" style="width:100%;">Register</button>
          <p id="modalRegClosedMsg" class="hidden" style="text-align:center;font-size:0.82rem;color:var(--slate);margin-top:0.5rem;"></p>
        </div>

        <!-- STATE 2: QR CODE -->
        <div id="modalStateQR" class="hidden" style="text-align:center;">
          <p style="font-size:0.82rem;color:var(--slate);margin-bottom:1rem;">Show this QR at the gate for check-in</p>
          <div id="modalQRWrap" style="display:flex;align-items:center;justify-content:center;min-height:200px;">
            <div class="spinner"></div>
          </div>
          <a class="btn btn-secondary btn-full" id="modalQRDownload" href="#" download style="margin-top:1rem;display:block;">⬇ Download QR</a>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js?v=9"></script>
  <script src="../js/auth.js?v=6"></script>
  <script src="../js/ui.js?v=6"></script>
  <script src="../js/participant/participant-hamburger.js?v=6"></script>
  <script src="../js/participant/event-modal.js?v=1"></script>
  <script src="../js/participant/events.js?v=10"></script>
</body>
</html>
