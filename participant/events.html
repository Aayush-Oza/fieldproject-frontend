<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events - EventOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css?v=5" />
  <link rel="stylesheet" href="../css/dashboard.css?v=5" />
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="dashboard.html" class="nav-logo">Event<span>Ops</span></a>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="events.html" class="active">Events</a></li>
        <li><a href="my-registrations.html">My Registrations</a></li>
        <li><a href="my-certificates.html">Certificates</a></li>
      </ul>
      <div class="nav-user">
        <span class="nav-user-name" id="navName">-</span>
        <span class="nav-role-badge role-participant">Participant</span>
        <button class="nav-logout" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="dash-main">

    <section class="dash-greeting">
      <div class="dash-greeting-inner">
        <p class="dash-greeting-sub">Discover</p>
        <h1 class="dash-greeting-name">All Events</h1>
      </div>
    </section>

    <!-- FILTERS -->
    <div class="filter-bar">
      <input class="form-input filter-search" id="searchInput" type="text" placeholder="Search events…" />
      <select class="form-select filter-select" id="statusFilter">
        <option value="all">All events</option>
        <option value="available">Available</option>
        <option value="registered">Registered</option>
        <option value="full">Full</option>
      </select>
    </div>

    <div id="eventGrid" class="event-grid">
      <div class="loading-state" style="grid-column:1/-1">
        <div class="spinner"></div><span>Loading events…</span>
      </div>
    </div>

  </main>

  <!-- QR MODAL -->
  <div class="modal-overlay hidden" id="qrModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Your QR code</h3>
        <button class="modal-close" id="qrModalClose">✕</button>
      </div>
      <div class="qr-modal-body">
        <p class="qr-event-name" id="qrEventName"></p>
        <div class="qr-img-wrap">
          <img id="qrImg" src="" alt="QR Code" />
        </div>
        <p class="qr-hint">Show this at the gate for check-in</p>
        <a class="btn btn-primary btn-full" id="qrDownload" href="#" download>Download QR</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js?v=8"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/ui.js?v=5"></script>
  <script src="../js/participant/participant-hamburger.js?v=5"></script>
  <script src="../js/participant/events.js?v=8"></script>
</body>
</html>
