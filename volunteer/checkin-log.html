<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-in Log - EventOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css?v=4" />
  <link rel="stylesheet" href="../css/dashboard.css?v=4" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="dashboard.html" class="nav-logo">Event<span>Ops</span></a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="scanner.html">Scanner</a></li>
      <li><a href="checkin-log.html" class="active">Check-in Log</a></li>
    </ul>
    <div class="nav-user">
      <span class="nav-user-name" id="navName"></span>
      <span class="nav-role-badge role-volunteer">Volunteer</span>
      <button class="nav-logout" id="logoutBtn">Sign out</button>
    </div>
    <!-- hamburger + drawer injected by volunteer-hamburger.js -->
  </div>
</nav>

<main class="dash-main">

  <div class="dash-greeting">
    <div>
      <div class="dash-greeting-sub">Volunteer · Check-in History</div>
      <div class="dash-greeting-name">Check-in Log</div>
    </div>
  </div>

  <!-- EVENT SELECTOR -->
  <div class="card" style="padding:1rem 1.5rem;">
    <div class="form-group" style="margin:0;">
      <label class="form-label">Select Event</label>
      <select class="form-select" id="eventSelect">
        <option value="">- choose an event -</option>
      </select>
    </div>
  </div>

  <!-- STATS -->
  <div class="dash-stats" style="grid-template-columns:repeat(3,1fr);" id="logStats">
    <div class="stat-card">
      <div class="stat-value" id="statCheckins">-</div>
      <div class="stat-label">Total Check-ins</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statCapacity">-</div>
      <div class="stat-label">Capacity</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statFill">-</div>
      <div class="stat-label">Fill Rate</div>
    </div>
  </div>

  <!-- LOG TABLE -->
  <div class="card" style="padding:0;">
    <div class="dash-card-header" style="padding:1.25rem 1.5rem 0;">
      <span class="card-title">Check-in Records</span>
      <button class="btn btn-secondary btn-sm" id="refreshBtn">↺ Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Registration ID</th>
            <th>Checked In At</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="3" style="text-align:center;padding:2rem;color:var(--slate)">Select an event to view check-ins.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<div class="toast hidden" id="toast"></div>

<script src="../js/api.js?v=4"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/volunteer/volunteer-hamburger.js?v=4"></script>
<script src="../js/volunteer/checkin.js?v=4"></script>
</body>
</html>
